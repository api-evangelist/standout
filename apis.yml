name: Standout
description: Standout (standout.work) is an AI talent agent for tech professionals in the United
  States. Candidates run a CLI (`npx standout`) that assesses how they think, build, and debug to
  create a living, verified profile of capability rather than a resume. Standout matches candidates
  to hiring companies and brokers a direct introduction to the founder when a match looks right — no
  applications and no recruiter middle layer. It is free for candidates; companies pay only on a
  successful hire. Backed by Y Combinator.
